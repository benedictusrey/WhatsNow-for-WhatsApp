<!doctype html>
<!-- WhatsNow isolated media fixture, maintained by @benedictusrey. -->
<meta charset="utf-8">
<title>WhatsNow background media fixture</title>
<h1>Background media test</h1>
<p>A quiet test tone plays. No WhatsApp data, camera, or microphone is accessed.</p>
<audio id="audio" controls></audio><video id="video" autoplay muted playsinline></video>
<canvas id="canvas" width="320" height="180"></canvas>
<script>
  const audio = document.querySelector('audio');
  const video = document.querySelector('video');
  const canvas = document.querySelector('canvas');
  const rate = 8000, samples = rate * 300;
  const bytes = new ArrayBuffer(44 + samples * 2), wav = new DataView(bytes);
  function text(offset, value) {
    for (let i = 0; i < value.length; i++) wav.setUint8(offset + i, value.charCodeAt(i));
  }
  text(0, 'RIFF'); wav.setUint32(4, bytes.byteLength - 8, true); text(8, 'WAVE');
  text(12, 'fmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true);
  wav.setUint16(22, 1, true); wav.setUint32(24, rate, true);
  wav.setUint32(28, rate * 2, true); wav.setUint16(32, 2, true); wav.setUint16(34, 16, true);
  text(36, 'data'); wav.setUint32(40, samples * 2, true);
  for (let i = 0; i < samples; i++) wav.setInt16(44 + i * 2, 1000 * Math.sin(2 * Math.PI * 220 * i / rate), true);
  audio.src = URL.createObjectURL(new Blob([bytes], {type: 'audio/wav'}));
  audio.loop = true;
  const context = canvas.getContext('2d');
  setInterval(() => {
    context.fillStyle = '#087a60'; context.fillRect(0, 0, 320, 180);
    context.fillStyle = 'white'; context.fillText(String(performance.now()), 20, 90);
  }, 100);
  video.srcObject = canvas.captureStream(5);
  window.snapshot = () => { document.title = JSON.stringify({
    time: audio.currentTime, paused: audio.paused, muted: audio.muted,
    videoTime: video.currentTime, videoPaused: video.paused, hidden: document.hidden
  }); };
  Promise.all([audio.play(), video.play()]).then(() => {
    window.ready = true; window.snapshot();
  }).catch(error => { document.title = JSON.stringify({error: String(error)}); });
</script>
