name: Feature request
description: Propose a focused WhatsNow improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: Describe the task you want WhatsNow to support.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - All platforms
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Privacy or security considerations
      description: Note any new remote-page command, stored data, notification content, or operating-system permission.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and release notes.
          required: true

