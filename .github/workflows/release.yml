name: Build WhatsNow 2.0.0 cross-platform release

# The public repository contains installation documentation only. The build
# source is checked out from a separate private repository at workflow time.
# This keeps the Settings UI and native implementation out of the public tree.

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Private source repository in owner/name form"
        required: true
        type: string
      source_ref:
        description: "Private source tag or commit to build"
        required: true
        default: "v2.0.0"
        type: string
      source_path:
        description: "Source project directory; use . when src-tauri is at the repository root"
        required: true
        default: "."
        type: string
      app_version:
        description: "Application version used in release filenames"
        required: true
        default: "2.0.0"
        type: string
      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "v2.0.0"
        type: string
      publish_release:
        description: "Create a draft GitHub Release after all builds pass"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v2.0.0"

permissions:
  contents: write

env:
  APP_VERSION: ${{ github.event.inputs.app_version || vars.WHATSNOW_APP_VERSION || '2.0.0' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
  SOURCE_REPOSITORY: ${{ github.event.inputs.source_repository || vars.WHATSNOW_SOURCE_REPOSITORY }}
  SOURCE_REF: ${{ github.event.inputs.source_ref || vars.WHATSNOW_SOURCE_REF || 'v2.0.0' }}
  SOURCE_PATH: ${{ github.event.inputs.source_path || vars.WHATSNOW_SOURCE_PATH || '.' }}

jobs:
  build-linux:
    name: Linux x64 bundles
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public release metadata
        uses: actions/checkout@v4

      - name: Validate private source configuration
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_REPOSITORY}" || {
            echo "::error::Set SOURCE_REPOSITORY through workflow input or repository variable WHATSNOW_SOURCE_REPOSITORY."
            exit 1
          }
          test -n "${SOURCE_REPO_TOKEN}" || {
            echo "::error::Create a read-only SOURCE_REPO_TOKEN secret for the private source repository."
            exit 1
          }

      - name: Checkout private v2.0.0 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Tauri project layout
        shell: bash
        run: |
          set -euo pipefail
          project_dir="source/${SOURCE_PATH}"
          test -f "${project_dir}/src-tauri/Cargo.toml" || {
            echo "::error::No src-tauri/Cargo.toml found under ${project_dir}. Set source_path to the private project directory."
            exit 1
          }
          test -f "${project_dir}/src-tauri/tauri.conf.json" || {
            echo "::error::No src-tauri/tauri.conf.json found under ${project_dir}."
            exit 1
          }
          test -d "${project_dir}/settings-ui" || {
            echo "::error::No settings-ui directory found under ${project_dir}."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux Tauri dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build AppImage and Debian package
        uses: tauri-apps/tauri-action@v0.5
        with:
          projectPath: source/${{ env.SOURCE_PATH }}
          tauriScript: cargo tauri
          args: --target x86_64-unknown-linux-gnu --bundles appimage,deb

      - name: Normalize and verify Linux assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          project_dir="source/${SOURCE_PATH}"
          appimage="$(find "${project_dir}/src-tauri/target" -type f -name '*.AppImage' -print -quit)"
          deb="$(find "${project_dir}/src-tauri/target" -type f -name '*.deb' -print -quit)"
          test -n "${appimage}" || { echo "::error::Tauri did not produce an AppImage."; exit 1; }
          test -n "${deb}" || { echo "::error::Tauri did not produce a Debian package."; exit 1; }
          cp "${appimage}" "out/WhatsNow_${APP_VERSION}_amd64.AppImage"
          cp "${deb}" "out/WhatsNow_${APP_VERSION}_amd64.deb"
          sha256sum out/WhatsNow_${APP_VERSION}_amd64.AppImage out/WhatsNow_${APP_VERSION}_amd64.deb | tee out/checksums-linux.sha256

      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhatsNow-${{ env.APP_VERSION }}-linux-amd64
          path: |
            out/WhatsNow_${{ env.APP_VERSION }}_amd64.AppImage
            out/WhatsNow_${{ env.APP_VERSION }}_amd64.deb
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS Apple Silicon bundles
    runs-on: macos-14
    steps:
      - name: Checkout public release metadata
        uses: actions/checkout@v4

      - name: Validate private source configuration
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_REPOSITORY}" || {
            echo "::error::Set SOURCE_REPOSITORY through workflow input or repository variable WHATSNOW_SOURCE_REPOSITORY."
            exit 1
          }
          test -n "${SOURCE_REPO_TOKEN}" || {
            echo "::error::Create a read-only SOURCE_REPO_TOKEN secret for the private source repository."
            exit 1
          }

      - name: Checkout private v2.0.0 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Tauri project layout
        shell: bash
        run: |
          set -euo pipefail
          project_dir="source/${SOURCE_PATH}"
          test -f "${project_dir}/src-tauri/Cargo.toml" || {
            echo "::error::No src-tauri/Cargo.toml found under ${project_dir}. Set source_path to the private project directory."
            exit 1
          }
          test -f "${project_dir}/src-tauri/tauri.conf.json" || {
            echo "::error::No src-tauri/tauri.conf.json found under ${project_dir}."
            exit 1
          }
          test -d "${project_dir}/settings-ui" || {
            echo "::error::No settings-ui directory found under ${project_dir}."
            exit 1
          }

      - name: Install Rust for Apple Silicon
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build DMG and macOS archive
        uses: tauri-apps/tauri-action@v0.5
        with:
          projectPath: source/${{ env.SOURCE_PATH }}
          tauriScript: cargo tauri
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Normalize and verify macOS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          project_dir="source/${SOURCE_PATH}"
          dmg="$(find "${project_dir}/src-tauri/target" -type f -name '*.dmg' -print -quit)"
          archive="$(find "${project_dir}/src-tauri/target" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "${dmg}" || { echo "::error::Tauri did not produce a DMG."; exit 1; }
          test -n "${archive}" || { echo "::error::Tauri did not produce a macOS app archive."; exit 1; }
          cp "${dmg}" "out/WhatsNow_${APP_VERSION}_aarch64.dmg"
          cp "${archive}" "out/WhatsNow_${APP_VERSION}_aarch64.app.tar.gz"
          shasum -a 256 out/WhatsNow_${APP_VERSION}_aarch64.dmg out/WhatsNow_${APP_VERSION}_aarch64.app.tar.gz | tee out/checksums-macos.sha256

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhatsNow-${{ env.APP_VERSION }}-macos-aarch64
          path: |
            out/WhatsNow_${{ env.APP_VERSION }}_aarch64.dmg
            out/WhatsNow_${{ env.APP_VERSION }}_aarch64.app.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows x64 bundles
    runs-on: windows-latest
    steps:
      - name: Checkout public release metadata
        uses: actions/checkout@v4

      - name: Validate private source configuration
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_REPOSITORY}" || {
            echo "::error::Set SOURCE_REPOSITORY through workflow input or repository variable WHATSNOW_SOURCE_REPOSITORY."
            exit 1
          }
          test -n "${SOURCE_REPO_TOKEN}" || {
            echo "::error::Create a read-only SOURCE_REPO_TOKEN secret for the private source repository."
            exit 1
          }

      - name: Checkout private v2.0.0 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Tauri project layout
        shell: bash
        run: |
          set -euo pipefail
          project_dir="source/${SOURCE_PATH}"
          test -f "${project_dir}/src-tauri/Cargo.toml" || {
            echo "::error::No src-tauri/Cargo.toml found under ${project_dir}. Set source_path to the private project directory."
            exit 1
          }
          test -f "${project_dir}/src-tauri/tauri.conf.json" || {
            echo "::error::No src-tauri/tauri.conf.json found under ${project_dir}."
            exit 1
          }
          test -d "${project_dir}/settings-ui" || {
            echo "::error::No settings-ui directory found under ${project_dir}."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build NSIS installer and MSI
        uses: tauri-apps/tauri-action@v0.5
        with:
          projectPath: source/${{ env.SOURCE_PATH }}
          tauriScript: cargo tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi --features windows10-memory

      - name: Normalize and verify Windows assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          project_dir="source/${SOURCE_PATH}"
          setup="$(find "${project_dir}/src-tauri/target" -type f -name '*.exe' -path '*nsis*' -print -quit)"
          msi="$(find "${project_dir}/src-tauri/target" -type f -name '*.msi' -print -quit)"
          test -n "${setup}" || { echo "::error::Tauri did not produce an NSIS installer."; exit 1; }
          test -n "${msi}" || { echo "::error::Tauri did not produce an MSI package."; exit 1; }
          cp "${setup}" "out/WhatsNow_${APP_VERSION}_x64-setup.exe"
          cp "${msi}" "out/WhatsNow_${APP_VERSION}_x64_en-US.msi"
          sha256sum out/WhatsNow_${APP_VERSION}_x64-setup.exe out/WhatsNow_${APP_VERSION}_x64_en-US.msi | tee out/checksums-windows.sha256

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhatsNow-${{ env.APP_VERSION }}-windows-x64
          path: |
            out/WhatsNow_${{ env.APP_VERSION }}_x64-setup.exe
            out/WhatsNow_${{ env.APP_VERSION }}_x64_en-US.msi
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create draft GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: ${{ github.event_name == 'push' || github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public release metadata
        uses: actions/checkout@v4

      - name: Download Linux, Windows, and macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: WhatsNow-${{ env.APP_VERSION }}-*
          path: dist
          merge-multiple: true

      - name: Create and verify combined checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "dist/WhatsNow_${APP_VERSION}_amd64.AppImage"
            "dist/WhatsNow_${APP_VERSION}_amd64.deb"
            "dist/WhatsNow_${APP_VERSION}_x64-setup.exe"
            "dist/WhatsNow_${APP_VERSION}_x64_en-US.msi"
            "dist/WhatsNow_${APP_VERSION}_aarch64.dmg"
            "dist/WhatsNow_${APP_VERSION}_aarch64.app.tar.gz"
          )
          for asset in "${expected[@]}"; do
            test -f "${asset}" || { echo "::error::Missing expected release asset: ${asset}"; exit 1; }
          done
          (cd dist && shasum -a 256 \
            "WhatsNow_${APP_VERSION}_amd64.AppImage" \
            "WhatsNow_${APP_VERSION}_amd64.deb" \
            "WhatsNow_${APP_VERSION}_x64-setup.exe" \
            "WhatsNow_${APP_VERSION}_x64_en-US.msi" \
            "WhatsNow_${APP_VERSION}_aarch64.dmg" \
            "WhatsNow_${APP_VERSION}_aarch64.app.tar.gz" > checksums.sha256)
          (cd dist && shasum -a 256 -c checksums.sha256)

      - name: Upload draft release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WhatsNow ${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          files: |
            dist/WhatsNow_${{ env.APP_VERSION }}_amd64.AppImage
            dist/WhatsNow_${{ env.APP_VERSION }}_amd64.deb
            dist/WhatsNow_${{ env.APP_VERSION }}_x64-setup.exe
            dist/WhatsNow_${{ env.APP_VERSION }}_x64_en-US.msi
            dist/WhatsNow_${{ env.APP_VERSION }}_aarch64.dmg
            dist/WhatsNow_${{ env.APP_VERSION }}_aarch64.app.tar.gz
            dist/checksums.sha256
