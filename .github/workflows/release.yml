name: Build WhatsNow cross-platform release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Application version used in release filenames"
        required: true
        default: "2.7.0"
        type: string
      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "v2.7.0"
        type: string
      publish_release:
        description: "Create a draft GitHub Release after all builds pass"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: whatsnow-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.app_version || '2.7.0' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Version and behavior gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser regression runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify release identity and regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const version = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version;
          assert.equal(fs.readFileSync('VERSION', 'utf8').trim(), version);
          assert.equal(process.env.APP_VERSION.replace(/^v/, ''), version);
          assert.equal(process.env.RELEASE_TAG, `v${version}`);
          JS
          node src-tauri/resources/bridge.test.mjs
          node src-tauri/resources/call-media.test.mjs
          node src-tauri/resources/call-lifecycle.test.mjs
          node src-tauri/resources/chat-theme.test.mjs
          node src-tauri/resources/toast-route.test.mjs
          node settings-ui/theme.test.mjs
          node settings-ui/settingsAcl.test.mjs
          node settings-ui/comboToAccelerator.test.mjs
          node scripts/check-docs.mjs
          node scripts/phone-routing.test.mjs
          node scripts/call-popup.test.mjs
          node scripts/settings-contrast.test.mjs
          node scripts/settings-shortcut.test.mjs
          node scripts/settings-attribution.test.mjs

  build-linux:
    name: Linux installer (AppImage)
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize version string
        shell: bash
        run: |
          RAW_VER="${APP_VERSION#v}"
          echo "NORMALIZED_VERSION=${RAW_VER}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Same package set as check.yml (which compiles this exact crate on
      # ubuntu-22.04) plus the AppImage tooling.
      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libdbus-1-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libhunspell-dev patchelf xdg-utils libfuse2

      - name: Install Tauri CLI
        shell: bash
        run: npm install -g @tauri-apps/cli@^2

      - name: Build AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Normalize and verify Linux installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          appimage="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          test -n "${appimage}" || { echo "::error::Tauri did not produce an AppImage."; exit 1; }
          test -s "${appimage}" || { echo "::error::The AppImage is empty."; exit 1; }
          cp "${appimage}" "out/WhatsNow_${NORMALIZED_VERSION}_linux_x86_64.AppImage"
          chmod +x "out/WhatsNow_${NORMALIZED_VERSION}_linux_x86_64.AppImage"
          (cd out && sha256sum "WhatsNow_${NORMALIZED_VERSION}_linux_x86_64.AppImage")

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: WhatsNow-${{ env.APP_VERSION }}-linux
          path: out/WhatsNow_${{ env.NORMALIZED_VERSION }}_linux_x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS installer (universal DMG)
    needs: verify
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize version string
        shell: bash
        run: |
          RAW_VER="${APP_VERSION#v}"
          echo "NORMALIZED_VERSION=${RAW_VER}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (Apple Silicon + Intel targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        shell: bash
        run: npm install -g @tauri-apps/cli@^2

      # One universal build (Apple Silicon + Intel). DMG creation on hosted
      # runners occasionally fails with a transient hdiutil error, so retry.
      - name: Build universal app and DMG
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if tauri build --target universal-apple-darwin --bundles app,dmg; then
              exit 0
            fi
            echo "::warning::tauri build failed (attempt ${attempt}/3)."
            sleep 15
          done
          echo "::error::The universal macOS build failed three times."
          exit 1

      - name: Normalize and verify macOS installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bundle="src-tauri/target/universal-apple-darwin/release/bundle"
          dmg="$(find "${bundle}/dmg" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          test -n "${dmg}" || { echo "::error::Tauri did not produce a universal DMG."; exit 1; }
          test -s "${dmg}" || { echo "::error::The DMG is empty."; exit 1; }
          app="$(find "${bundle}/macos" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "${app}" || { echo "::error::Tauri did not produce a .app bundle."; exit 1; }
          universal=0
          for binary in "${app}"/Contents/MacOS/*; do
            archs="$(lipo -archs "${binary}" 2>/dev/null || true)"
            echo "${binary}: ${archs}"
            case " ${archs} " in
              *" arm64 "*) case " ${archs} " in *" x86_64 "*) universal=1 ;; esac ;;
            esac
          done
          test "${universal}" -eq 1 || { echo "::error::The app binary is not universal (arm64 + x86_64)."; exit 1; }
          cp "${dmg}" "out/WhatsNow_${NORMALIZED_VERSION}_macos_universal.dmg"
          (cd out && shasum -a 256 "WhatsNow_${NORMALIZED_VERSION}_macos_universal.dmg")

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: WhatsNow-${{ env.APP_VERSION }}-macos
          path: out/WhatsNow_${{ env.NORMALIZED_VERSION }}_macos_universal.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows installer (NSIS setup)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize version string
        shell: bash
        run: |
          RAW_VER="${APP_VERSION#v}"
          echo "NORMALIZED_VERSION=${RAW_VER}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        shell: bash
        run: npm install -g @tauri-apps/cli@^2

      - name: Build NSIS installer
        shell: bash
        run: tauri build --target x86_64-pc-windows-msvc --bundles nsis --features windows-memory

      - name: Verify Windows media feature regressions
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo test --locked --features windows-memory,portable-mode
          cargo clippy --locked --all-targets --features windows-memory,portable-mode -- -D warnings

      - name: Normalize and verify Windows installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          setup="$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -maxdepth 1 -type f -name '*-setup.exe' | head -n 1)"
          test -n "${setup}" || { echo "::error::Tauri did not produce an NSIS installer."; exit 1; }
          test -s "${setup}" || { echo "::error::The NSIS installer is empty."; exit 1; }
          cp "${setup}" "out/WhatsNow_${NORMALIZED_VERSION}_windows_x64-setup.exe"
          (cd out && sha256sum "WhatsNow_${NORMALIZED_VERSION}_windows_x64-setup.exe")

      - name: Sign Windows installer (when certificate secrets are configured)
        if: ${{ env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $certPath = Join-Path $env:RUNNER_TEMP "whatsnow.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $timestampArgs = @()
          if ($env:WINDOWS_TIMESTAMP_URL) {
            $timestampArgs = @("/tr", $env:WINDOWS_TIMESTAMP_URL, "/td", "sha256")
          }
          Get-ChildItem out -File -Filter "WhatsNow_$env:NORMALIZED_VERSION*" | ForEach-Object {
            & signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 @timestampArgs $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
          }
          Remove-Item -LiteralPath $certPath -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WhatsNow-${{ env.APP_VERSION }}-windows
          path: out/WhatsNow_${{ env.NORMALIZED_VERSION }}_windows_x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create draft GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: ${{ github.event_name == 'push' || github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize version string
        shell: bash
        run: |
          RAW_VER="${APP_VERSION#v}"
          echo "NORMALIZED_VERSION=${RAW_VER}" >> "$GITHUB_ENV"

      - name: Download the three installers
        uses: actions/download-artifact@v4
        with:
          pattern: WhatsNow-${{ env.APP_VERSION }}-*
          path: dist
          merge-multiple: true

      - name: Create and verify checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "WhatsNow_${NORMALIZED_VERSION}_windows_x64-setup.exe"
            "WhatsNow_${NORMALIZED_VERSION}_macos_universal.dmg"
            "WhatsNow_${NORMALIZED_VERSION}_linux_x86_64.AppImage"
          )
          for asset in "${expected[@]}"; do
            test -s "dist/${asset}" || { echo "::error::Missing expected release asset: ${asset}"; exit 1; }
          done
          extra="$(find dist -maxdepth 1 -type f ! -name 'WhatsNow_*' | head -n 1)"
          test -z "${extra}" || { echo "::error::Unexpected file in the release set: ${extra}"; exit 1; }
          (cd dist && shasum -a 256 "${expected[@]}" > checksums.sha256)
          (cd dist && shasum -a 256 -c checksums.sha256)

      - name: Upload draft release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WhatsNow ${{ env.NORMALIZED_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/WhatsNow_${{ env.NORMALIZED_VERSION }}_windows_x64-setup.exe
            dist/WhatsNow_${{ env.NORMALIZED_VERSION }}_macos_universal.dmg
            dist/WhatsNow_${{ env.NORMALIZED_VERSION }}_linux_x86_64.AppImage
            dist/checksums.sha256
